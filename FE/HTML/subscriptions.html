<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <meta name="description" content="키워드 알림과 Discord 웹훅 구독을 관리하세요.">
    <title>키워드 구독 — FEED</title>
    <link rel="stylesheet" href="../CSS/account-flow.css">
</head>
<body>
    <header>
        <a class="brand" href="index.html" aria-label="FEED 홈"><span class="brandMark">T<span>/</span></span><strong>FEED<span class="brandDot">.</span></strong></a>
        <nav class="pageNav" aria-label="구독 메뉴"><a href="index.html">아티클</a><a href="account.html">내 계정</a></nav>
    </header>
    <main class="managePage">
        <section class="flowCard" aria-labelledby="subscriptionHeading">
            <p class="eyebrow">PERSONAL FEED</p>
            <h1 id="subscriptionHeading">키워드 구독</h1>
            <p id="authPrompt" class="flowMessage hide"><span id="authPromptMessage">구독을 관리하려면 로그인하세요.</span> <a href="account.html?next=subscriptions.html">로그인 또는 회원가입</a></p>
            <div id="subscriptionManager" class="hide">
                <p class="flowHint">키워드가 포함된 새 글을 이메일 또는 Discord로 받아보세요.</p>
                <form id="subscriptionForm" class="flowForm">
                    <label for="keywordInput">키워드</label>
                    <input id="keywordInput" type="text" required minlength="1" maxlength="100" placeholder="예: Python, Kubernetes">
                    <label for="webhookInput">Discord 웹훅 <span>(선택)</span></label>
                    <input id="webhookInput" type="url" placeholder="https://discord.com/api/webhooks/…">
                    <p id="subscriptionMessage" class="flowMessage" role="status" aria-live="polite"></p>
                    <button class="solidAction" type="submit">구독 추가</button>
                </form>
                <div class="subscriptionListHeading"><h2>내 구독</h2><button id="refreshSubscriptions" class="textAction" type="button">새로고침</button></div>
                <div id="subscriptionList" class="managedSubscriptions" aria-live="polite"></div>
            </div>
            <a class="flowLink" href="index.html">아티클로 돌아가기</a>
        </section>
    </main>
    <script src="../JS/config.js"></script>
    <script src="../JS/api-client.js"></script>
    <script src="../JS/subscriptions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Developer HireHaul Dashboard</title>
    <link rel="stylesheet" href="/FE/CSS/index.css">
</head>
<body>
    <header>
        <a class="homeLink" href="/FE/HTML/index.html"><span class="mainIcon">D<span class="mainIconLine">-</span></span></a>
        <h2 class="mainTitle"><a class="homeLink" href="/FE/HTML/index.html">Developer HireHaul</a></h2>
    </header>
    <hr class="divideLine">
    <nav>
        <div class="buttonBox">
            <a href="/FE/HTML/index.html">Home</a>
            <a href="#">Test</a>
        </div>
        <div class="searchBox">
            <input type="text" id="searchInput" autocomplete="off"><button id="searchButton">검색</button>
        </div>
    </nav>
    <hr class="divideLine">
    <main>
        <section id="cards">
            <div id="searchAction" class="hide">검색 중입니다.</div>
            <div id="searchFailed" class="hide">검색에 실패 했습니다.</div>
        </section>
        <aside>
            <h2 class="tagTitle">Tag filter</h2>
            <hr class="divideLine">
            <div id="tagBox">
                <button class="tag"><div class="checkBox"></div>Front End</button>
                <button class="tag"><div class="checkBox"></div>Back End</button>
                <button class="tag"><div class="checkBox"></div>AI</button>
            </div>
        </aside>
    </main>
    <script src="/FE/JS/index.js"></script>
</body>
</html>

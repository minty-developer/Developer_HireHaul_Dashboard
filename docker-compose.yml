services:
  backend:
    build:
      context: ./BE
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      DATABASE_PATH: /app/data/tech_blog.db
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-1048576}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      PORT: 5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  scheduler:
    build:
      context: ./BE
    command: python -m flask run-scheduler
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      DATABASE_PATH: /app/data/tech_blog.db
      BACKUP_DIRECTORY: /app/data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      FEED_COLLECTION_INTERVAL_SECONDS: ${FEED_COLLECTION_INTERVAL_SECONDS:-3600}
      FEED_COLLECTION_TIMEOUT_SECONDS: ${FEED_COLLECTION_TIMEOUT_SECONDS:-20}
    volumes:
      - backend_data:/app/data
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  backend_data:
